version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zhilun-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zhilun
      POSTGRES_PASSWORD: zhilun_dev_2026
      POSTGRES_DB: zhilun_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - zhilun-network

  redis:
    image: redis:7-alpine
    container_name: zhilun-redis
    restart: unless-stopped
    command: redis-server --requirepass zhilun_redis_2026
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zhilun-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: zhilun-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@zhilun.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    depends_on:
      - postgres
    networks:
      - zhilun-network

volumes:
  postgres_data:
  redis_data:

networks:
  zhilun-network:
    driver: bridge
